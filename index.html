<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>باركود+ — جرد المخزون بالباركود وتصدير Excel</title>
    <!-- مكتبة الباركود المستقرة للكاميرا -->
    <script src="https://cloudflare.com"></script>
    <style>
        /* كود التصميم الثابت والمستقر لحل مشكلة التداخل تماماً */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; padding: 20px; display: flex; justify-content: center; }
        .wrapper { width: 100%; max-width: 450px; display: flex; flex-col; gap: 16px; flex-direction: column; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .header h1 { font-size: 20px; font-weight: 900; color: #fff; }
        .header h1 span { font-size: 11px; color: #94a3b8; font-weight: normal; margin-right: 5px; }
        
        .glass-panel { background: #161b22; border: 1px solid #21262d; border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        #reader { width: 100%; min-height: 200px; background: #090d13; border-radius: 12px; border: 2px dashed #30363d; display: flex; align-items: center; justify-content: center; overflow: hidden; text-align: center; padding: 15px; color: #64748b; font-size: 12px; }
        #reader video { border-radius: 12px; object-fit: cover; }
        
        .btn { width: 100%; padding: 14px; border-radius: 12px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; transition: transform 0.1s, opacity 0.2s; text-align: center; display: block; }
        .btn:active { transform: scale(0.98); }
        .btn-blue { background: linear-gradient(to right, #06b6d4, #2563eb); color: white; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
        .btn-success { background-color: #059669; color: white; }
        .btn-amber { background: linear-gradient(to right, #f59e0b, #ea580c); color: #0f172a; font-weight: 900; }
        .btn-danger { background: transparent; border: 1px solid rgba(239,68,68,0.2); color: #f87171; font-size: 11px; padding: 8px; }
        
        .file-label { width: 100%; padding: 12px; background: #21262d; border: 1px solid #30363d; color: #cbd5e1; border-radius: 12px; text-align: center; cursor: pointer; font-size: 12px; display: block; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: right; }
        .form-group label { font-size: 11px; color: #94a3b8; font-weight: 500; }
        
        .input-text { width: 100%; padding: 12px; bg-color: #0d1117; background: #0d1117; border: 1px solid #21262d; border-radius: 12px; color: white; text-align: center; font-family: monospace; font-size: 16px; letter-spacing: 2px; outline: none; }
        .input-text:focus { border-color: #06b6d4; }
        
        .qty-container { display: flex; align-items: center; gap: 10px; }
        .qty-btn { width: 48px; h-height: 48px; height: 48px; background: #21262d; border: 1px solid #30363d; color: white; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .qty-input { flex: 1; height: 48px; background: #0d1117; border: 1px solid #21262d; border-radius: 12px; text-align: center; color: white; font-size: 20px; font-weight: bold; outline: none; }
        
        .flex-row-box { display: flex; justify-content: space-between; align-items: center; }
        .stats-lbl { font-size: 11px; color: #94a3b8; }
        .stats-val { font-size: 14px; font-weight: bold; color: white; margin-top: 2px; }
        
        .warning-text { color: #f59e0b; font-size: 11px; text-align: right; margin-top: 4px; display: none; }
        
        /* النوافذ المنبثقة - مخفية تماماً بشكل افتراضي لتجنب العشوائية */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content { width: 100%; max-width: 450px; background: rgba(22, 27, 34, 0.95); border: 1px solid #30363d; border-radius: 24px 24px 0 0; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 25px rgba(0,0,0,0.5); }
        @media (min-width: 640px) { .modal-overlay { align-items: center; } .modal-content { border-radius: 24px; } }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 16px; font-weight: bold; color: white; }
        .modal-close { background: none; border: none; color: #64748b; font-size: 18px; cursor: pointer; }
        
        .history-item { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 12px; text-align: right; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
        
        #toast-el { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(22, 27, 34, 0.95); border: 1px solid #30363d; color: #06b6d4; font-weight: bold; padding: 12px 24px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 200; display: none; font-size: 13px; }
    </style>
</head>
<body>

    <div id="toast-el"></div>

    <div class="wrapper">
        <!-- الرأس العلوي -->
        <div class="header">
            <h1>باركود+ <span>جرد المخزون</span></h1>
            <button onclick="openHistory()" style="background: #21262d; border: 1px solid #30363d; padding: 6px 12px; color: #cbd5e1; border-radius: 8px; font-size: 11px; cursor: pointer;">📜 سجل الجرد</button>
        </div>

        <!-- منطقة الكاميرا (Lovable UI) -->
        <div class="glass-panel">
            <div id="reader">
                <span id="camera-status-text">اضغط على زر الفتح لبدء استخدام كاميرا المسح التلقائي</span>
            </div>
        </div>

        <!-- أزرار التحكم والمسح -->
        <button id="start-btn" onclick="initLiveScanner()" class="btn btn-blue">فتح الكاميرا والمسح</button>
        
        <label class="file-label">
            📷 التقاط صورة للباركود
            <input type="file" accept="image/*" style="display: none;" onchange="scanFromUploadedFile(this)">
        </label>

        <!-- لوحة الإدخال والكمية الفعالة -->
        <div class="glass-panel" style="display: flex; flex-direction: column; gap: 16px;">
            <div class="form-group">
                <label>إدخال يدوي للباركود</label>
                <input type="text" id="barcode-input" oninput="checkDuplicateInput(this.value)" placeholder="اكتب رمز الباركود" class="input-text">
                <p id="dup-warning" class="warning-text">⚠️ تنبيه: هذا الباركود ممسوح مسبقاً في هذه الجلسة!</p>
            </div>

            <div class="form-group">
                <label style="color: #f87171;">الكمية الفعالة (أرقام فقط)*</label>
                <div class="qty-container">
                    <button onclick="stepQuantity(-1)" class="qty-btn">-</button>
                    <input type="number" id="quantity-input" min="1" value="1" class="qty-input">
                    <button onclick="stepQuantity(1)" class="qty-btn">+</button>
                </div>
            </div>

            <button onclick="commitItemToInventory()" class="btn btn-success">📥 حفظ في قائمة الجرد</button>
        </div>

        <!-- أداة التصدير والعدّ الإحصائي -->
        <div class="glass-panel flex-row-box">
            <div style="text-align: right;">
                <span class="stats-lbl">تصدير الجرد الحالي</span>
                <p id="inventory-stats" class="stats-val">0 أسطر · 0 قطعة</p>
            </div>
            <button onclick="triggerExportFlow()" class="btn btn-amber" style="width: auto; padding: 10px 20px; font-size: 12px;">تصدير Excel</button>
        </div>

        <!-- زر مسح البيانات المؤقتة -->
        <button onclick="flushActiveSession()" class="btn btn-danger">🗑️ مسح الجلسة الحالية وبدء جرد جديد</button>
    </div>

    <!-- نافذة المسؤول قبل التصدير (Person Modal) -->
    <div id="person-modal" class="modal-overlay" onclick="closePersonModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>بيانات مسؤول الجرد</h3>
                <button onclick="closePersonModal()" class="modal-close">✕</button>
            </div>
            <div class="form-group">
                <input type="text" id="person-name" placeholder="اسم الموظف المسؤول" class="input-text" style="text-align: right; font-family: inherit; letter-spacing: normal;">
            </div>
            <div class="form-group">
                <input type="text" id="person-dept" placeholder="القسم / المستودع" class="input-text" style="text-align: right; font-family: inherit; letter-spacing: normal;">
            </div>
            <button onclick="submitExportFlow()" class="btn btn-blue" style="font-size: 13px;">تأكيد وتنزيل ملف Excel</button>
        </div>
    </div>

    <!-- لوحة سجل الجرد لآخر 48 ساعة (History Panel) -->
    <div id="history-panel" class="modal-overlay" onclick="closeHistory()">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-height: 80vh; overflow-y: auto;">
            <div class="modal-header">
                <div style="text-align: right;">
                    <h3>سجل الجرد</h3>
                    <span style="font-size: 10px; color: #94a3b8;">الملفات المصدرة خلال آخر 48 ساعة تلقائياً.</span>
                </div>
                <button onclick="closeHistory()" class="modal-close">✕</button>
            </div>
            <div id="history-list" style="margin-top: 10px;">
                <!-- تعبئة السجل ديناميكياً هنا -->
            </div>
